name: Update contribution stats

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:       # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - scripts/generate_stats.py
      - .github/workflows/update-stats.yml

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contributions card
        run: python scripts/generate_stats.py
        env:
          # Uses STATS_TOKEN (a PAT) if you add one, otherwise falls back to the built-in token.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/contributions.svg
          git diff --cached --quiet || (git commit -m "chore: update contribution stats" && git push)
